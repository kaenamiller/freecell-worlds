# One-shot live tail. This file is not in deploy-api.yml's path filter, so pushing
# it does not redeploy the Worker. Delete it after the Resend line is captured.

name: Tail staging once

on:
  push:
    branches: [player-accounts]
    paths:
      - '.github/workflows/tail-staging-once.yml'

permissions:
  contents: read

jobs:
  logs:
    name: Read staging email logs
    runs-on: ubuntu-latest
    environment:
      name: staging
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Read the staging3 account row
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute freecell-worlds-staging --remote --env staging --json \
            --command "SELECT email, emailVerified, createdAt FROM \"user\" WHERE email LIKE 'opsdoug+staging%@mail.grokbot.com'"

      - name: Query persisted email logs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'EOF'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const redact = (value) => String(value).replace(/https?:\/\/\S+/gi, '[url]').replace(/\bre_[A-Za-z0-9]+\b/g, '[redacted]');
          const now = Date.now();
          const res = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/observability/telemetry/query`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              view: 'events',
              limit: 20,
              timeframe: { from: now - 3 * 60 * 60 * 1000, to: now },
              parameters: {
                datasets: ['cloudflare-workers'],
                filterCombination: 'and',
                filters: [
                  { key: '$metadata.service', operation: 'eq', type: 'string', value: 'freecell-worlds-api-staging' },
                  { key: '$metadata.message', operation: 'includes', type: 'string', value: '[email] Resend' },
                ],
              },
            }),
          });
          const text = await res.text();
          console.log(`observability http ${res.status}`);
          let json = null;
          try { json = JSON.parse(text); } catch { console.log(redact(text).slice(0, 400)); }
          if (json?.success === false) console.log(redact(JSON.stringify(json.errors || json)).slice(0, 600));
          const events = json?.result?.events?.events || [];
          console.log(`count=${json?.result?.events?.count ?? events.length} run=${json?.result?.run?.status || 'none'}`);
          for (const event of events) {
            const message = event?.$metadata?.message ?? '';
            const raw = Array.isArray(message) ? message.join(' ') : String(message);
            console.log(redact(raw).slice(0, 500));
          }
          EOF

  tail:
    name: Tail staging email
    runs-on: ubuntu-latest
    environment:
      name: staging
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Tail staging logs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "tail starting $(date -u +%H:%M:%S)"
          timeout 1200 npx wrangler tail --env staging --format json
          echo "tail finished ($?) $(date -u +%H:%M:%S)"
