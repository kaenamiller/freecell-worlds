# One-shot live tail. Not in the deploy path filter. Does not deploy the Worker.
# Pass 2, for the deletion email.

name: Tail staging once

on:
  push:
    branches: [player-accounts]
    paths:
      - '.github/workflows/tail-staging-once.yml'

permissions:
  contents: read

jobs:
  tail:
    name: Tail staging email
    runs-on: ubuntu-latest
    environment:
      name: staging
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Tail staging logs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "tail starting $(date -u +%H:%M:%S)"
          timeout 1200 npx wrangler tail --env staging --format json | node --input-type=module -e '
          import readline from "node:readline";
          const rl = readline.createInterface({ input: process.stdin });
          const redact = (s) => String(s)
            .replace(/reset-password\/[A-Za-z0-9_-]+/g, "reset-password/[redacted]")
            .replace(/([?&]token=)[^&\s"\\]+/g, "$1[redacted]")
            .replace(/delete-account-[A-Za-z0-9]+/g, "delete-account-[redacted]")
            .replace(/\bre_[A-Za-z0-9]+\b/g, "[redacted]")
            .replace(/https?:\/\/\S+/g, "[url]");
          for await (const line of rl) console.log(redact(line));
          '
          echo "tail finished ($?) $(date -u +%H:%M:%S)"
