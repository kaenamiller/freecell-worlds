# Staging deploys on every push to main or player-accounts that touches the API.
# Production deploys only from a manual run, and only after the GitHub environment
# "production" approves it.
#
# Required reviewers are a GitHub setting, not a workflow key. Before the first
# production run: Settings → Environments → production → Required reviewers.
# Leave the "staging" environment without reviewers so pushes deploy on their own.
#
# Environment secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Optional environment secret: TURNSTILE_SECRET_KEY (uploaded on deploy when the
# worker does not already have it).
#
# Token: Workers Scripts (Edit / Workers Scripts Write), D1, R2, Account Settings
# Read, Workers Routes, DNS, and Zone Read. Creating or updating a Workflow
# accepts Workers Scripts Write; Cloudflare does not offer a separate Workflows
# permission. Creating a Worker that does not exist yet needs Workers Admin at
# the Workers product scope when the token uses the new Workers roles. Legacy
# Workers Scripts Edit still includes create until that permission is removed.
#
# First-run order: D1 migrations do not need the Worker. `wrangler secret list`
# and `secret put` do, and fail with "run wrangler deploy first" on a new
# Worker. This job treats that as an empty secret list and uploads missing
# secrets in the same `wrangler deploy --secrets-file` that creates the Worker.
# Secrets already on the Worker are not replaced.

name: Deploy API

on:
  push:
    branches: [main, player-accounts]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: api-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  staging:
    name: Deploy staging
    if: github.event_name == 'push' || github.event.inputs.target == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://api-staging.freecellworlds.com
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Apply staging D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: d1 migrations apply freecell-worlds-staging --remote --env staging

      - name: Prepare deploy secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: node scripts/prepare-deploy-secrets.mjs --env=staging

      - name: Deploy staging Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy --env staging${{ steps.secrets.outputs.secrets_arg }}

      - name: Remove secrets file
        if: always()
        run: rm -f /tmp/fcw-deploy-secrets.json

  production:
    name: Deploy production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.freecellworlds.com
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Apply production D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: d1 migrations apply freecell-worlds --remote --env=""

      - name: Prepare deploy secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: node scripts/prepare-deploy-secrets.mjs --env=

      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy --env=""${{ steps.secrets.outputs.secrets_arg }}

      - name: Remove secrets file
        if: always()
        run: rm -f /tmp/fcw-deploy-secrets.json
