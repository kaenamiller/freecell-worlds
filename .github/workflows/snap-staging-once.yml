# One-shot row counts for the staging account check. Not in the deploy path filter.
# Delete after the check. Do not deploy the Worker from this file.
# Pass 3: seal the deletion token. Do not deploy.

name: Snap staging once

on:
  push:
    branches: [player-accounts]
    paths:
      - '.github/workflows/snap-staging-once.yml'

permissions:
  contents: read

jobs:
  snap:
    name: Snapshot staging rows
    runs-on: ubuntu-latest
    environment:
      name: staging
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'EOF'
          import { spawnSync } from 'node:child_process';
          import { publicEncrypt, constants } from 'node:crypto';
          const pub = `-----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAq919hfBrPPKgzVMomzLh
          oNs0RJrj3RXWNnYnfqoRL10omIixhsdGYNz/ss1tpKd6cNB9aqQg7HNlCEdjHBPv
          ZdZxKrNU4c2BqLPE4gddW8y/w9oX0jMOVaklY1mp8cIr/CDcbV8GpkaxC69JI9X2
          2nN1qWtFt9gJQrQECInUb6SWwUJsCStbu2mW3KEHUe+P7hKNylE9vtWZ3YE2swvy
          48QcT9diGAO4dCe2dziqAckdhN2gjoKg/LK/5eeL13adKZkuyNY3wZiB7ZhCvNNv
          0c3N5HMNfZnEG7RwwiXpINVmat9LrtsnuorqI78wNLVQtSrGAP/d6G+zKdnVzxmc
          jQIDAQAB
          -----END PUBLIC KEY-----`.replace(/^          /gm, '');
          function d1(sql) {
            const r = spawnSync('npx', ['wrangler', 'd1', 'execute', 'freecell-worlds-staging', '--remote', '--env', 'staging', '--json', '--command', sql], { encoding: 'utf8' });
            if (r.status !== 0) {
              console.log(`d1_fail ${r.status} ${String(r.stderr || '').replace(/https?:\/\/\S+/g, '[url]').slice(0, 300)}`);
              return [];
            }
            const start = r.stdout.indexOf('[');
            const end = r.stdout.lastIndexOf(']');
            if (start < 0 || end < start) return [];
            return JSON.parse(r.stdout.slice(start, end + 1))[0]?.results || [];
          }
          const email = 'opsdoug+staging4@mail.grokbot.com';
          const found = d1(`SELECT id, emailVerified FROM "user" WHERE email = '${email}'`);
          const userId = found[0]?.id && /^[0-9a-f-]{36}$/i.test(found[0].id) ? found[0].id : '00000000-0000-0000-0000-000000000000';
          console.log(`user_present ${found[0] ? 1 : 0} verified=${found[0]?.emailVerified ?? 'na'}`);
          const counts = d1(`SELECT
            (SELECT COUNT(*) FROM session WHERE userId = '${userId}') AS sessions,
            (SELECT COUNT(*) FROM account WHERE userId = '${userId}') AS accounts,
            (SELECT COUNT(*) FROM save_slot WHERE user_id = '${userId}') AS saves,
            (SELECT COUNT(*) FROM token_ledger WHERE user_id = '${userId}') AS ledger,
            (SELECT COUNT(*) FROM custom_theme WHERE user_id = '${userId}') AS themes,
            (SELECT COUNT(*) FROM event WHERE player_id = '${userId}') AS events`);
          const row = counts[0] || {};
          console.log(`counts sessions=${row.sessions ?? 'na'} accounts=${row.accounts ?? 'na'} saves=${row.saves ?? 'na'} ledger=${row.ledger ?? 'na'} themes=${row.themes ?? 'na'} events=${row.events ?? 'na'}`);
          const keys = d1(`SELECT key FROM save_slot WHERE user_id = '${userId}'`);
          console.log(`save_keys ${keys.map((k) => k.key).join(',') || 'none'}`);
          const tokens = d1(`SELECT identifier FROM verification WHERE value = '${userId}' AND (identifier LIKE 'reset-password:%' OR identifier LIKE 'delete-account-%')`);
          for (const token of tokens) {
            const identifier = String(token.identifier || '');
            const label = identifier.startsWith('reset-password:') ? 'reset' : 'delete';
            const secret = identifier.slice(label === 'reset' ? 'reset-password:'.length : 'delete-account-'.length);
            const buf = publicEncrypt({ key: pub, padding: constants.RSA_PKCS1_OAEP_PADDING, oaepHash: 'sha256' }, Buffer.from(secret));
            console.log(`sealed ${label} ${buf.toString('base64')}`);
          }
          const orphans = d1(`SELECT
            (SELECT COUNT(*) FROM "user" WHERE email = '${email}') AS staging4,
            (SELECT COUNT(*) FROM session s LEFT JOIN "user" u ON u.id = s.userId WHERE u.id IS NULL) AS sessions,
            (SELECT COUNT(*) FROM account a LEFT JOIN "user" u ON u.id = a.userId WHERE u.id IS NULL) AS accounts,
            (SELECT COUNT(*) FROM save_slot s LEFT JOIN "user" u ON u.id = s.user_id WHERE u.id IS NULL) AS saves,
            (SELECT COUNT(*) FROM token_ledger t LEFT JOIN "user" u ON u.id = t.user_id WHERE u.id IS NULL) AS ledger,
            (SELECT COUNT(*) FROM custom_theme t LEFT JOIN "user" u ON u.id = t.user_id WHERE u.id IS NULL) AS themes,
            (SELECT COUNT(*) FROM verification v LEFT JOIN "user" u ON u.id = v.value WHERE u.id IS NULL) AS verifications,
            (SELECT COUNT(*) FROM event e LEFT JOIN "user" u ON u.id = e.player_id WHERE e.player_id IS NOT NULL AND u.id IS NULL) AS events`);
          const o = orphans[0] || {};
          console.log(`orphans staging4=${o.staging4 ?? 'na'} sessions=${o.sessions ?? 'na'} accounts=${o.accounts ?? 'na'} saves=${o.saves ?? 'na'} ledger=${o.ledger ?? 'na'} themes=${o.themes ?? 'na'} verifications=${o.verifications ?? 'na'} events=${o.events ?? 'na'}`);
          console.log('snap done');
          EOF
