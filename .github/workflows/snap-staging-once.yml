# One-shot row counts for the staging account check. Not in the deploy path filter.
# Delete after the check. Do not deploy the Worker from this file.

name: Snap staging once

on:
  push:
    branches: [player-accounts]
    paths:
      - '.github/workflows/snap-staging-once.yml'

permissions:
  contents: read

jobs:
  snap:
    name: Snapshot staging rows
    runs-on: ubuntu-latest
    environment:
      name: staging
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'EOF'
          import { spawnSync } from 'node:child_process';
          function d1(sql) {
            const r = spawnSync('npx', ['wrangler', 'd1', 'execute', 'freecell-worlds-staging', '--remote', '--env', 'staging', '--json', '--command', sql], { encoding: 'utf8' });
            if (r.status !== 0) {
              console.log(`d1_fail ${r.status} ${String(r.stderr || '').replace(/https?:\/\/\S+/g, '[url]').slice(0, 300)}`);
              return [];
            }
            const start = r.stdout.indexOf('[');
            const end = r.stdout.lastIndexOf(']');
            if (start < 0 || end < start) return [];
            return JSON.parse(r.stdout.slice(start, end + 1))[0]?.results || [];
          }
          const users = d1(`SELECT email, emailVerified FROM "user" WHERE email LIKE 'opsdoug+%@mail.grokbot.com' ORDER BY email`);
          for (const user of users) console.log(`user ${user.email} verified=${user.emailVerified}`);
          console.log(`user_count ${users.length}`);
          const tables = d1(`SELECT name FROM sqlite_master WHERE type = 'table' ORDER BY name`);
          console.log(`tables ${tables.map((t) => t.name).join(',')}`);
          EOF
