<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Liminal art test</title>
<style>
  body { margin: 0; background: #141210; color: #f3eadf; font: 15px/1.4 Georgia, serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 48px; }
  h1 { font-weight: 500; font-size: 22px; margin: 0 0 6px; }
  p.note { margin: 0 0 28px; color: #cbbba8; }
  section { margin: 0 0 36px; }
  h2 { font-weight: 500; font-size: 18px; margin: 0 0 10px; }
  img { width: 100%; height: auto; display: block; background: #000; }
  .hero { border-radius: 8px; }
  .pair { display: grid; grid-template-columns: 1fr 220px; gap: 12px; align-items: start; }
  @media (max-width: 720px) { .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Three ways into the same empty room</h1>
  <p class="note">Gemini nano banana 2.1. Title scene and card back for each candidate. Test art only.</p>
  <section>
    <h2>Laundromat, 1 a.m.</h2>
    <div class="pair">
      <img class="hero" src="laundromat-hero.png" alt="Empty laundromat at night, rain on the door, warm dryers, cards on a folding table">
      <img src="laundromat-back.png" alt="Mint and chrome card back with a round dryer-door medallion">
    </div>
  </section>
  <section>
    <h2>Pastel liminal room</h2>
    <div class="pair">
      <img class="hero" src="liminal-hero.png" alt="Endless yellow wallpaper corridor under fluorescent lights, cards on a low table">
      <img src="liminal-back.png" alt="Yellow damask card back split by a white fluorescent bar">
    </div>
  </section>
  <section>
    <h2>Vaporwave</h2>
    <div class="pair">
      <img class="hero" src="vaporwave-hero.png" alt="Deserted mall atrium in pink and cyan light, palm, bust, and cards on marble">
      <img src="vaporwave-back.png" alt="Pink and teal card back with palms and a classical column">
    </div>
  </section>
</main>
</body>
</html>
