<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Locked theme art</title>
<style>
  body { margin: 0; background: #12100e; color: #f4ecdf; font: 16px/1.4 Georgia, serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 28px 18px 64px; }
  h1 { font-weight: 500; font-size: 24px; margin: 0 0 8px; }
  .note { color: #cbbba6; margin: 0 0 28px; }
  section { margin: 0 0 42px; }
  h2 { font-weight: 500; font-size: 20px; margin: 0 0 10px; }
  .pair { display: grid; grid-template-columns: 1fr 200px; gap: 12px; align-items: start; }
  img { width: 100%; height: auto; display: block; border-radius: 8px; background: #000; }
  @media (max-width: 720px) { .pair { grid-template-columns: 1fr 120px; } }
</style>
</head>
<body>
<main>
  <h1>Locked themes</h1>
  <p class="note">Title scene and card back. Tables, rooms, and court portraits are saved with them. Not in the game yet.</p>
  <section><h2>Signal</h2><div class="pair"><img src="signal-hero.webp" alt="Radio dish under the stars"><img src="signal-back.webp" alt="Signal card back"></div></section>
  <section><h2>Roller Rink</h2><div class="pair"><img src="rink-hero.webp" alt="Empty roller rink and a mirror ball"><img src="rink-back.webp" alt="Rink card back"></div></section>
  <section><h2>Main Street</h2><div class="pair"><img src="mainstreet-hero.webp" alt="Western street at dusk with a horse"><img src="mainstreet-back.webp" alt="Main Street card back"></div></section>
  <section><h2>Plaster Studio</h2><div class="pair"><img src="plaster-hero.webp" alt="Unfinished plaster figure in north light"><img src="plaster-back.webp" alt="Plaster card back"></div></section>
  <section><h2>Darkroom</h2><div class="pair"><img src="darkroom-hero.webp" alt="Safelight darkroom with an enlarger"><img src="darkroom-back.webp" alt="Darkroom card back"></div></section>
  <section><h2>Dracula's Castle</h2><div class="pair"><img src="castle-hero.webp" alt="Castle door, moon, and one candle"><img src="castle-back.webp" alt="Castle card back"></div></section>
  <section><h2>Diving Bell</h2><div class="pair"><img src="bathysphere-hero.webp" alt="Brass diving bell among jellyfish"><img src="bathysphere-back.webp" alt="Diving bell card back"></div></section>
  <section><h2>Fire Lookout</h2><div class="pair"><img src="lookout-hero.webp" alt="Lookout cab above a forest at dusk"><img src="lookout-back.webp" alt="Lookout card back"></div></section>
  <section><h2>Silent Cinema</h2><div class="pair"><img src="cinema-hero.webp" alt="Empty picture palace and a projector beam"><img src="cinema-back.webp" alt="Cinema card back"></div></section>
  <section><h2>Backrooms</h2><div class="pair"><img src="backrooms-hero.webp" alt="Yellow fluorescent corridor"><img src="backrooms-back.webp" alt="Backrooms card back"></div></section>
  <section><h2>Vaporwave</h2><div class="pair"><img src="vaporwave-hero.webp" alt="Sunset mall atrium"><img src="vaporwave-back.webp" alt="Vaporwave card back"></div></section>
</main>
</body>
</html>
