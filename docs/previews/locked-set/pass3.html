<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Castle, deep sea, Smoke Watch</title>
<style>
  body { margin: 0; background: #12100e; color: #f4ecdf; font: 16px/1.45 Georgia, serif; }
  main { max-width: 980px; margin: 0 auto; padding: 28px 18px 64px; }
  h1 { font-weight: 500; font-size: 24px; margin: 0 0 8px; }
  h2 { font-weight: 500; font-size: 20px; margin: 28px 0 8px; }
  p { color: #cbbba6; margin: 0 0 12px; }
  img { width: 100%; height: auto; display: block; border-radius: 8px; background: #000; }
</style>
</head>
<body>
<main>
  <h1>Three new scenes</h1>
  <h2>The castle, farther back</h2>
  <p>The whole silhouette, the moon, and the bats. Cards stay on the near rock.</p>
  <img src="castle-distant.webp" alt="A full gothic castle on a crag under the moon">
  <h2>Deep sea, with a bell</h2>
  <p>Last night's jellyfish and wreck, plus a brass diving bell on the bow.</p>
  <img src="deepsea-bell.webp" alt="Glowing jellyfish, sunken ship, and a diving bell">
  <h2>Smoke Watch</h2>
  <p>The glass cab, the round map table, and one column of smoke.</p>
  <img src="smoke-watch.webp" alt="Lookout cab with a map table and distant smoke">
</main>
</body>
</html>
