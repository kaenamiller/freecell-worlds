<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Voyage UI preview</title><link rel="icon" href="../assets/icons/icon-192.png"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/voyage.css"><style>
#preview-controls { position: fixed; z-index: 120; top: 8px; left: 8px; right: 8px; display: flex; gap: 7px; align-items: center; flex-wrap: wrap; padding: 7px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-solid); font: 12px system-ui,sans-serif; color: var(--text); box-shadow: 0 8px 30px #0008; }
#preview-controls select, #preview-controls button { padding: 5px; border: 1px solid var(--border); border-radius: 4px; background: var(--panel-solid); color: var(--text); font: inherit; }
#preview-controls button { cursor: pointer; } #preview-controls .note { color: var(--muted); }
body.preview-clean #preview-controls { display: none; }
#preview-background { position: fixed; inset: 0; background: radial-gradient(ellipse at center, color-mix(in srgb, var(--accent) 14%, var(--bg)), var(--bg)); }
body.preview-clean #title-screen { z-index: 1; }
@media(max-width:600px) { #preview-controls .note { display: none; } }
</style></head><body data-theme="roman"><div id="preview-background"></div><div id="preview-controls"><strong>Voyage UI</strong><label>Screen <select id="preview-screen"></select></label><label>Theme <select id="preview-theme"></select></label><button id="preview-next">Next →</button><span class="note">Click nodes, charms, tabs and actions to inspect them.</span></div><script type="module" src="./voyage-ui-preview.mjs"></script></body></html>
